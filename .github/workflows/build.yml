
name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake gettext autopoint \
            libtool pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Download Arabic fonts
        run: |
          mkdir -p fonts
          curl -fL -o fonts/Tajawal-Regular.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf"
          curl -fL -o fonts/Tajawal-Bold.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython
          buildozer --version

      - name: Clean Android Build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show Detailed Errors
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "========== LAST 200 LOG LINES =========="
            tail -n 200 build.log

            echo "========== PYTHON ERRORS =========="
            grep -inE \
              "Traceback|ModuleNotFoundError|ImportError|UnboundLocalError" \
              build.log | tail -n 60 || true

            echo "========== COMPILATION ERRORS =========="
            grep -inE \
              "error:|fatal error:|FAILED|Exception:|ERROR:" \
              build.log | tail -n 100 || true

            echo "========== NUMPY / PANDAS =========="
            grep -inE \
              "numpy|pandas|Cython|hostpython|pythonforandroid" \
              build.log | tail -n 100 || true
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: binance-scanner-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Fail if Build Failed
        if: steps.build.outcome != 'success'
        run: exit 1
